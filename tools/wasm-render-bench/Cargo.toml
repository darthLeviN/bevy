[package]
name = "wasm-render-bench"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
bevy = { path = "../..", default-features = false, features = ["std", "async_executor", "bevy_log", "bevy_asset", "bevy_pbr", "bevy_window", "bevy_winit", "webgpu", "wasm_threads"] }
wasm_thread = "=0.3.3"
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Performance", "Document", "Element"] }

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
debug = 0
strip = "debuginfo"
panic = "abort"
