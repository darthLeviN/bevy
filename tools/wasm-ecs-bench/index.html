<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Headless Wasm ECS benchmark</title></head>
<body>
<script type="module">
const channel = new BroadcastChannel('bevy-ecs-benchmark');
let finished = false;
let browserTicks = 0;
const heartbeat = setInterval(() => { browserTicks++; }, 0);
function complete(value) {
  if (finished) return;
  finished = true;
  clearInterval(heartbeat);
  if (value && value.fatal == null) value.page_event_loop_ticks = browserTicks;
  if (value?.fatal != null) window.ecsBenchmarkFatal = String(value.fatal);
  else window.ecsBenchmarkResult = value;
  window.dispatchEvent(new Event('ecs-benchmark-complete'));
  channel.close();
}
channel.onmessage = event => complete(event.data);
window.addEventListener('error', event => complete({ fatal: event.message }));
window.addEventListener('unhandledrejection', event => complete({ fatal: String(event.reason) }));
try {
  if (!crossOriginIsolated || typeof SharedArrayBuffer === 'undefined') {
    throw Error('Cross-origin isolation and shared Wasm memory are required');
  }
  const { default: init, start } = await import('./pkg/wasm_ecs_bench.js');
  await init();
  await start(new URL('./pkg/wasm_ecs_bench.js', location.href).href,
    new URL('./pool-worker.mjs', location.href).href, 4);
} catch (error) {
  complete({ fatal: String(error?.stack ?? error) });
}
</script>
</body>
</html>
