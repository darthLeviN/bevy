[package]
name = "bevy_tasks"
version = "0.20.1"
edition = "2024"
description = "A task executor for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[features]
default = ["async_executor", "futures-lite"]

# Enables multi-threading support.
# Without this feature, all tasks will be run on a single thread.
multi_threaded = [
  "bevy_platform/std",
  "dep:async-channel",
  "dep:concurrent-queue",
  "async_executor",
]

# Experimental shared-memory Web Workers. Requires an atomics-enabled standard
# library. Await init_web_thread_pools before running schedules on a regular page.
wasm_threads = ["multi_threaded", "dep:wasm_thread"]

# Uses the engine-owned async-executor adaptation on every target.
# This backend is incompatible with `no_std` targets.
async_executor = ["bevy_platform/std", "async-task/std", "dep:concurrent-queue", "dep:fastrand", "dep:pin-project-lite", "dep:slab", "futures-lite"]

# Provide an implementation of `block_on` from  `futures-lite`.
futures-lite = ["bevy_platform/futures-lite"]

# Use async-io's implementation of block_on instead of futures-lite's implementation.
# This is preferred if your application uses async-io.
async-io = ["bevy_platform/async-io"]

[dependencies]
bevy_platform = { path = "../bevy_platform", version = "0.20.1", default-features = false, features = [
  "alloc",
] }

futures-lite = { version = "2.0.1", default-features = false, features = [
  "alloc",
] }
async-task = { version = "4.7.1", default-features = false }
derive_more = { version = "2", default-features = false, features = [
  "deref",
  "deref_mut",
] }
# The engine-owned executor retains upstream's algorithms but uses platform locks.
fastrand = { version = "2.0.0", optional = true }
pin-project-lite = { version = "0.2", optional = true }
slab = { version = "0.4.4", optional = true }
async-channel = { version = "2.3.0", optional = true }
concurrent-queue = { version = "2.0.0", optional = true }
atomic-waker = { version = "1", default-features = false }
crossbeam-queue = { version = "0.3", default-features = false, features = [
  "alloc",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-task = "1"
wasm_thread = { version = "=0.3.3", optional = true }

[target.'cfg(not(all(target_has_atomic = "8", target_has_atomic = "16", target_has_atomic = "32", target_has_atomic = "64", target_has_atomic = "ptr")))'.dependencies]
async-task = { version = "4.7.1", default-features = false, features = [
  "portable-atomic",
] }
heapless = { version = "0.9", default-features = false, features = [
  "portable-atomic",
] }
atomic-waker = { version = "1", default-features = false, features = [
  "portable-atomic",
] }

[dev-dependencies]
futures-lite = { version = "2.0.1", default-features = false, features = [
  "std",
] }
async-channel = "2.3.0"

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
